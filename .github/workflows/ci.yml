name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - run: bun run lint
      - run: bunx tsc --noEmit
      # Offline suite: no database, no network, no API key.
      - run: bun run test
      # Database suite: builds a throwaway SQLite file by applying the
      # migrations, the way a fresh clone does. Still no network and no key.
      # This is the gate that would have caught the 2026-08-08 blockers, both of
      # which passed lint, tsc and the build.
      - run: bun run test:db

  build:
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    # `next build` evaluates src/lib/env.ts, which requires these to be present.
    # The build no longer migrates — that moved to the container entrypoint — so
    # DATABASE_URL only has to parse; nothing here reads or writes a database.
    # Throwaway values, never real data.
    env:
      DATABASE_URL: "file:./db/ci.db"
      NEXTAUTH_SECRET: "ci-build-only-not-a-real-secret"
      NEXTAUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - run: bun run build